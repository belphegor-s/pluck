# Minimal SearXNG config for Pluck: JSON API on, rate limiter off (internal only).
use_default_settings: true
server:
  limiter: false
  image_proxy: false
  method: GET
search:
  safe_search: 1
  formats:
    - html
    - json
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
