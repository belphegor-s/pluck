# Pluck, fully self-hosted. No external services required.
#
#   cp .env.example .env   # set PLUCK_ENCRYPTION_KEY and BOOTSTRAP_API_KEY at minimum
#   docker compose up -d
#
# API:  http://localhost:8080  (docs at /docs)
# Web:  http://localhost:3000
# MCP:  http://localhost:8081/mcp

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://pluck:${POSTGRES_PASSWORD:-pluck}@postgres:5432/pluck
  REDIS_URL: redis://redis:6379
  CACHE_REDIS_URL: redis://redis-cache:6379
  SEARXNG_URL: http://searxng:8080
  S3_ENDPOINT: http://storage:9000
  S3_REGION: us-east-1
  S3_BUCKET: pluck
  S3_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-pluck}
  S3_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-pluck-storage-secret}
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000/pluck}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  PLUCK_ENCRYPTION_KEY: ${PLUCK_ENCRYPTION_KEY:?set PLUCK_ENCRYPTION_KEY (32+ chars)}
  BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
  BILLING_ENABLED: "false"
  ALLOW_PRIVATE_NETWORK: ${ALLOW_PRIVATE_NETWORK:-false}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
  PLUCK_LLM_PROVIDER: ${PLUCK_LLM_PROVIDER:-}
  PLUCK_LLM_API_KEY: ${PLUCK_LLM_API_KEY:-}
  PLUCK_LLM_MODEL: ${PLUCK_LLM_MODEL:-}
  PLUCK_LLM_BASE_URL: ${PLUCK_LLM_BASE_URL:-}
  PROXY_DATACENTER_URLS: ${PROXY_DATACENTER_URLS:-}
  PROXY_RESIDENTIAL_URLS: ${PROXY_RESIDENTIAL_URLS:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pluck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pluck}
      POSTGRES_DB: pluck
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluck"]
      interval: 5s
      retries: 20

  # Queue store: must never evict.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Cache + rate limits: bounded, evicts least-recently-used keys.
  redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes: ["./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro"]

  # S3-compatible object storage for screenshots and logos. SeaweedFS replaced
  # MinIO, which stopped publishing community images. Optional: without it,
  # screenshots come back inline as data URIs.
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      S3_KEY: ${STORAGE_ACCESS_KEY:-pluck}
      S3_SECRET: ${STORAGE_SECRET_KEY:-pluck-storage-secret}
    # The credentials file is written from the environment on start, so no
    # secret lives in the repository. "anonymous" may only read the bucket.
    entrypoint: >
      sh -c 'mkdir -p /etc/seaweedfs &&
             printf "{\"identities\":[{\"name\":\"pluck\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"List\",\"Tagging\",\"Write\"]},{\"name\":\"anonymous\",\"actions\":[\"Read:pluck\"]}]}" "$$S3_KEY" "$$S3_SECRET" > /etc/seaweedfs/s3.json &&
             exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0'
    ports: ["9000:9000"]
    volumes: [storage:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      retries: 30

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-pluck}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-pluck-storage-secret}
      AWS_DEFAULT_REGION: us-east-1
    # The S3 gateway can come up a moment after the master reports healthy.
    entrypoint: >
      sh -c 'for i in $$(seq 1 30); do
               aws --endpoint-url http://storage:9000 s3api head-bucket --bucket pluck 2>/dev/null && exit 0;
               aws --endpoint-url http://storage:9000 s3api create-bucket --bucket pluck && exit 0;
               sleep 2;
             done; exit 1'

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      <<: *app-env
      BROWSER_CONCURRENCY: ${BROWSER_CONCURRENCY:-4}
    shm_size: 1gb
    depends_on: [api]

  mcp:
    build: { context: ., target: mcp }
    restart: unless-stopped
    environment:
      PLUCK_API_INTERNAL_URL: http://api:8080
    ports: ["8081:8081"]
    depends_on: [api]

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_MCP_URL: ${PUBLIC_MCP_URL:-http://localhost:8081}
    restart: unless-stopped
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres:
  redis:
  storage:
